<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#17181a;--muted:#6f6b62;--line:#e4e0d6;--soft:#eeebe3;--accent:#1f3a5f;--good:#2e7d5b;--warn:#b5651d;--bad:#b23b3b;
  --c1:#1f3a5f;--c2:#4f7cac;--c3:#8fb3d9;--c4:#c9a24a;--c5:#7a9e7e;--c6:#c97b5a;--c7:#9a8bb5;--c8:#b8b2a6}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--card:#1b1c1f;--ink:#eeece6;--muted:#9a968c;--line:#2b2c30;--soft:#232428;--accent:#8fb3d9;
  --good:#5cbf8f;--warn:#e0a060;--bad:#e07a7a;--c1:#8fb3d9;--c2:#4f7cac;--c3:#c9d9ea;--c8:#5a5853}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select{font:inherit;color:inherit}
/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lockbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px}
.lockbox h1{font-size:34px}
.lockbox p{color:var(--muted);margin:6px 0 22px}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.row{display:flex;align-items:center;gap:8px}
.chk{margin:14px 0 18px;color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--card);border-color:var(--accent);width:100%;padding:13px}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
/* app */
#app{display:none}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
nav .brand{font-family:Fraunces,serif;font-size:24px;font-weight:600;padding:0 10px 4px}
nav .upd{color:var(--muted);font-size:12px;padding:0 10px 18px}
nav a{display:block;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer}
nav a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
nav .spacer{flex:1}
main{padding:30px 34px 60px;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.head h2{font-size:28px}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.mid{font-size:22px;font-weight:700;margin-top:2px}
.hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.hi td{background:var(--soft)}
.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.g{background:rgba(46,125,91,.12);color:var(--good)}.pill.w{background:rgba(181,101,29,.13);color:var(--warn)}.pill.b{background:rgba(178,59,59,.12);color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.list li{margin:0 0 10px}.list{padding-left:18px;margin:0}
.dl input,.dl select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.dl select{text-align:left}
.dl td{padding:5px 6px}
.sec td{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:16px;border-top:0}
.w{width:56px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.scroll{overflow-x:auto}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
svg text{fill:var(--muted);font:11px Inter,sans-serif}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
  nav .brand,nav .upd,nav .spacer{display:none}
  nav a{white-space:nowrap}
  main{padding:20px 16px 50px}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="lock">
  <form class="lockbox" id="lockForm">
    <h1>CFO</h1>
    <p>Enter your password to open the tracker.</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
    <label class="row chk"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn primary" id="unlockBtn" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app">
  <div class="shell">
    <nav id="nav">
      <div class="brand">CFO</div>
      <div class="upd" id="upd"></div>
      <a data-v="overview">Overview</a>
      <a data-v="goals">Goals</a>
      <a data-v="budget">Budget</a>
      <a data-v="paychecks">Paychecks</a>
      <a data-v="networth">Net worth</a>
      <a data-v="subs">Subscriptions</a>
      <a data-v="deals">Deal calculator</a>
      <a data-v="areas">Location scorecard</a>
      <a data-v="notes">Notes</a>
      <div class="spacer"></div>
      <a id="lockBtn">Lock</a>
    </nav>
    <main id="view"></main>
  </div>
</div>

<script>
/* ================= crypto ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const subtle = crypto.subtle;
const DB='cfo-key', STORE='k';
function idb(mode, fn){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{ const tx=r.result.transaction(STORE,mode); const q=fn(tx.objectStore(STORE)); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }; }); }
async function fetchJSON(f){ const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('missing '+f); return r.json(); }

async function unwrapKey(pw, lock){
  const base = await subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const kek = await subtle.deriveKey({name:'PBKDF2', salt:b64d(lock.salt), iterations:lock.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pk8 = await subtle.decrypt({name:'AES-GCM', iv:b64d(lock.iv)}, kek, b64d(lock.wpk));   // throws on wrong password
  return subtle.importKey('pkcs8', pk8, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveKey']);
}
async function openData(priv){
  const box = await fetchJSON('data.enc.json');
  const epk = await subtle.importKey('spki', b64d(box.epk), {name:'ECDH', namedCurve:'P-256'}, false, []);
  const key = await subtle.deriveKey({name:'ECDH', public:epk}, priv, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await subtle.decrypt({name:'AES-GCM', iv:b64d(box.iv)}, key, b64d(box.ct));
  return JSON.parse(dec.decode(pt));
}

document.getElementById('lockForm').onsubmit = async e => {
  e.preventDefault();
  const pw=document.getElementById('pw').value, btn=document.getElementById('unlockBtn'), err=document.getElementById('err');
  if(!pw) return;
  btn.disabled=true; btn.textContent='Unlocking…'; err.textContent='';
  let priv;
  try { priv = await unwrapKey(pw, await fetchJSON('lock.json')); }
  catch(x){ btn.disabled=false; btn.textContent='Unlock'; err.textContent = /missing/.test(x.message) ? 'The tracker hasn’t been set up yet.' : 'Wrong password.'; return; }
  try {
    const data = await openData(priv);
    if (document.getElementById('remember').checked) { try{ await idb('readwrite', s=>s.put(priv,'priv')); }catch(_){} }
    document.getElementById('pw').value='';
    start(data);
  } catch(x){ btn.disabled=false; btn.textContent='Unlock'; err.textContent='Password worked, but the data file couldn’t be opened. Ask Claude to re-publish it.'; }
};
document.getElementById('lockBtn').onclick = async () => { try{ await idb('readwrite', s=>s.delete('priv')); }catch(_){} location.reload(); };
(async()=>{ try{ const priv = await idb('readonly', s=>s.get('priv')); if(priv) start(await openData(priv)); }catch(_){} })();

/* ================= helpers ================= */
let D, view='overview';
const $ = id => document.getElementById(id);
const money = (n,d=0) => n==null ? '—' : (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (n,d=1) => (n*100).toFixed(d)+'%';
const mo = (amt,f) => f==='y' ? amt/12 : amt;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); };
const monthsUntil = s => { const t=parseD(s), n=today(); return Math.max(1,(t.getFullYear()-n.getFullYear())*12 + t.getMonth()-n.getMonth()); };
const fmtMonth = d => d.toLocaleDateString('en-US',{month:'short',year:'numeric'});
const fmtDay = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];

function model(){
  const I=D.income, monthlyNet=I.netPaycheck*I.paychecks/12;
  const fixed=D.fixed.reduce((a,[,v,f])=>a+mo(v,f),0), variable=D.variable.reduce((a,[,v])=>a+v,0);
  const efMo=D.ef.perPaycheck*26/12, propMo=D.prop.perPaycheck*26/12;
  const rothMo = new Date().getFullYear()>D.roth.year ? D.roth.perPaycheck*26/12 : 0;
  const savings=efMo+propMo+rothMo, expenses=fixed+variable;
  const assets=D.accounts.reduce((a,x)=>a+(x[1]||0),0), debts=D.debts.reduce((a,x)=>a+x[1],0);
  return {monthlyNet,fixed,variable,expenses,efMo,propMo,rothMo,savings,unalloc:monthlyNet-expenses-savings,assets,debts,nw:assets-debts};
}
function goal(g, roundTo){
  const n=monthsUntil(g.targetDate), i=g.rate/12, f=Math.pow(1+i,n);
  let need = g.balance>=g.target ? 0 : (g.target-g.balance*f)*i/(f-1);
  need = Math.ceil(need/roundTo)*roundTo;
  const pay=g.perPaycheck*26/12;
  const nper = Math.ceil(Math.log((g.target*i+pay)/(g.balance*i+pay))/Math.log(1+i));
  const fin=today(); fin.setMonth(fin.getMonth()+nper);
  return {n,need,pay,pctDone:g.balance/g.target,finish:fin,onTrack:pay>=need};
}
function paychecks(){
  const out=[], end=parseD(D.planEnd), M=model(), bills=M.expenses/2, rothStart=parseD(D.roth.start);
  for(let d=parseD(D.payFirst); d<=end; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+D.payDays)){
    const prev=out[out.length-1]; const nth = prev && prev.d.getMonth()===d.getMonth() ? prev.nth+1 : 1;
    const roth = d>=rothStart ? D.roth.perPaycheck : 0, b = nth<=2 ? bills : 0;
    const net=D.income.netPaycheck;
    out.push({d,nth,net,ef:D.ef.perPaycheck,prop:D.prop.perPaycheck,roth,bills:b,left:net-D.ef.perPaycheck-D.prop.perPaycheck-roth-b});
  }
  return out;
}
function bar(p,color){ return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,p*100))}%;${color?'background:'+color:''}"></i></div>`; }
function stack(parts){ const t=parts.reduce((a,p)=>a+Math.max(0,p[1]),0)||1;
  return `<div class="stack">${parts.map((p,i)=>`<i style="width:${Math.max(0,p[1])/t*100}%;background:${p[2]||COLORS[i%8]}"></i>`).join('')}</div>
  <div class="legend">${parts.map((p,i)=>`<span><b style="background:${p[2]||COLORS[i%8]}"></b>${esc(p[0])} ${money(p[1])}</span>`).join('')}</div>`; }

/* ================= views ================= */
const V = {};
V.overview = () => {
  const M=model(), ef=goal(D.ef,1), pr=goal(D.prop,10), pcs=paychecks(), t=today();
  const next=pcs.find(p=>p.d>=t), floorGap=D.checking-D.checkingFloor;
  const third=pcs.find(p=>p.d>=t && p.nth===3);
  return `
  <div class="head"><div><h2>Overview</h2><div class="sub">Balances as of ${esc(D.snapshot)}</div></div></div>
  <div class="grid g4">
    <div class="card"><div class="lbl">Net worth</div><div class="big num">${money(M.nw,2)}</div><div class="hint">${M.debts?money(M.debts)+' in debt':'Zero debt'}</div></div>
    <div class="card"><div class="lbl">Monthly take-home</div><div class="big num">${money(M.monthlyNet)}</div><div class="hint">${money(D.income.netPaycheck,2)} per paycheck</div></div>
    <div class="card"><div class="lbl">Savings rate</div><div class="big num">${pct(M.savings/M.monthlyNet)}</div><div class="hint">${money(M.savings)} / month to goals</div></div>
    <div class="card"><div class="lbl">Next payday</div><div class="mid">${next?fmtDay(next.d):'—'}</div><div class="hint">${next?money(next.left,2)+' left to allocate':''}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Where each month goes</h3>
      ${stack([['Bills & spending',M.expenses],['Emergency fund',M.efMo],['Property fund',M.propMo]].concat(M.rothMo?[['Roth IRA',M.rothMo]]:[]).concat([['Unallocated',M.unalloc,'var(--c8)']]))}
      <div class="hint" style="margin-top:12px">Unallocated goes to: checking floor → unexpected costs → extra property fund → brokerage / Schwab.</div>
    </div>
    <div class="card"><h3>Checking floor</h3>
      <div class="kv"><span>Checking now</span><span class="num">${money(D.checking)}</span></div>
      <div class="kv"><span>Floor</span><span class="num">${money(D.checkingFloor)}</span></div>
      <div class="kv"><span>Above / (below)</span><span class="num ${floorGap<0?'bad':'good'}">${floorGap<0?'('+money(-floorGap)+')':money(floorGap)}</span></div>
      <div class="hint">${floorGap<0?'Below the floor — top it up from the next leftover before anything else.':'Above the floor.'}</div>
    </div>
  </div>
  <div class="grid g3" style="margin-top:14px">
    ${goalCard('Emergency fund',D.ef,ef)}
    ${goalCard('Property fund',D.prop,pr)}
    <div class="card"><div class="lbl">Roth IRA ${D.roth.year}</div><div class="mid num">${money(D.roth.ytd)} <span class="sub">of ${money(D.roth.limit)}</span></div>
      ${bar(D.roth.ytd/D.roth.limit,'var(--good)')}<div class="hint">${D.roth.ytd>=D.roth.limit?'Maxed. ':''}Next year: ${money(D.roth.perPaycheck,2)} per paycheck from ${fmtMonth(parseD(D.roth.start))}.</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>To do</h3><ul class="list">${D.actions.map(a=>`<li><b>${esc(a[0])}.</b> <span class="sub">${esc(a[1])}</span></li>`).join('')}</ul></div>
    <div class="card"><h3>Coming up</h3>
      ${third?`<div class="kv"><span>Next 3-paycheck month</span><span>${fmtMonth(third.d)}</span></div><div class="kv"><span>Leftover on that 3rd check</span><span class="num good">${money(third.left,2)}</span></div>`:''}
      <div class="kv"><span>Bonus</span><span>${esc(D.bonus[1][1].split('.')[0])}</span></div>
      <div class="kv"><span>401(k)</span><span>Details ~Jan 1, 2027</span></div>
    </div>
  </div>`;
};
function goalCard(name,g,r){
  return `<div class="card"><div class="lbl">${name}</div><div class="mid num">${money(g.balance)} <span class="sub">of ${money(g.target)}</span></div>
    ${bar(r.pctDone)}<div class="hint">${pct(r.pctDone)} funded · target ${fmtMonth(parseD(g.targetDate))}</div>
    <div class="hint">${r.onTrack?'<span class="good">On track</span>':'<span class="warn">Behind target</span>'} — finishes ~${fmtMonth(r.finish)} at the current pace</div></div>`;
}

V.goals = () => {
  const ef=goal(D.ef,1), pr=goal(D.prop,10);
  const g = (name,G,r,extra) => `<div class="card"><h3>${name}</h3>
    <div class="big num">${money(G.balance,2)}</div>${bar(r.pctDone)}<div class="hint">${pct(r.pctDone)} of ${money(G.target)}</div>
    <div style="margin-top:12px">
    <div class="kv"><span>Target date</span><span>${fmtMonth(parseD(G.targetDate))} (${r.n} months)</span></div>
    <div class="kv"><span>Needed per month</span><span class="num">${money(r.need)}</span></div>
    <div class="kv"><span>Actual (${money(G.perPaycheck)} per paycheck, from ${esc(G.from)})</span><span class="num">${money(r.pay)}</span></div>
    <div class="kv"><span>Est. yield</span><span>${pct(G.rate,2)}</span></div>
    <div class="kv"><span>Finishes at current pace</span><span class="${r.onTrack?'good':'warn'}">${fmtMonth(r.finish)}</span></div>
    </div>${extra?`<div class="hint" style="margin-top:8px">${extra}</div>`:''}</div>`;
  return `<div class="head"><div><h2>Goals</h2><div class="sub">Recalculates from today's date</div></div></div>
  <div class="grid g2">${g('Emergency fund (Ally)',D.ef,ef,'Ally may close accounts with no activity for 18+ months — keep a small transfer running after you hit $12k.')}
  ${g('First property fund (Fidelity MM)',D.prop,pr,esc(D.prop.note))}</div>
  <div class="card" style="margin-top:14px"><h3>Roth IRA</h3>
    <div class="kv"><span>${D.roth.year} contributed</span><span class="num">${money(D.roth.ytd)} of ${money(D.roth.limit)}</span></div>
    <div class="kv"><span>From ${fmtMonth(parseD(D.roth.start))}</span><span class="num">${money(D.roth.perPaycheck,2)} per paycheck (~${money(D.roth.perPaycheck*26/12)}/mo)</span></div></div>`;
};

V.budget = () => {
  const M=model(), rows=(list,isFixed)=>list.map(x=>{ const m=isFixed?mo(x[1],x[2]):x[1]; return `<tr><td>${esc(x[0])}</td><td class="r num">${money(m)}</td><td class="r num">${money(m*12)}</td></tr>`; }).join('');
  const cats=D.fixed.map(x=>[x[0].replace(/ \(.*\)/,''),mo(x[1],x[2])]).concat(D.variable.map(x=>[x[0].replace(/ \(.*\)/,''),x[1]])).filter(c=>c[1]>0).sort((p,q)=>q[1]-p[1]);
  return `<div class="head"><div><h2>Budget</h2><div class="sub">Monthly plan</div></div></div>
  <div class="grid g4">
    <div class="card"><div class="lbl">Take-home</div><div class="mid num">${money(M.monthlyNet)}</div></div>
    <div class="card"><div class="lbl">Expenses</div><div class="mid num">${money(M.expenses)}</div><div class="hint">${pct(M.expenses/M.monthlyNet)} of income</div></div>
    <div class="card"><div class="lbl">Saved to goals</div><div class="mid num">${money(M.savings)}</div><div class="hint">${pct(M.savings/M.monthlyNet)} of income</div></div>

/* ---------- deal calculator ---------- */
const DKEY='cfo.deals';
function dealsState(){ try{ const s=JSON.parse(localStorage.getItem(DKEY)); if(s&&s.length===D.deals.length) return s; }catch(_){} return JSON.parse(JSON.stringify(D.deals)); }
let deals=null;
function pmt(r,n,pv){ return r? pv*r/(1-Math.pow(1+r,-n)) : pv/n; }
function calc(d){
  const M=model(), fha=d.loan==='FHA', down=fha?.035:.05, mip=fha?.0055:.006, r=d.rate/100/12, n=d.term*12;
  const downAmt=d.price*down, base=d.price-downAmt, loan=fha?base*1.0175:base;
  const pi=pmt(r,n,loan), tax=d.price*d.tax/100/12, ins=d.ins/12, mi=base*mip/12, piti=pi+tax+ins+mi+d.hoa;
  const net=piti-d.rentOther, allIn=net+d.util, grossMo=D.income.gross/12, lenderRent=d.rentOther*.75, dti=piti/(grossMo+lenderRent);
  const verdict = dti<=.45?['Likely OK','g']:dti<=.5?['Possible (needs strong file)','w']:dti<=.57?['FHA stretch only','w']:['Too high','b'];
  const closing=d.price*d.closing/100, credit=-Math.min(closing,d.price*d.seller/100), reserves=piti*d.reserves, cash=downAmt+closing+credit+reserves;
  const gap=D.prop.balance-cash, months=gap>=0?0:Math.ceil(-gap/M.propMo);
  const rent=d.rentOther+d.rentYours, opex=rent*(d.vac+d.rep+d.capex+d.pm)/100, cf=rent-piti-opex, coc=(cf*12)/(downAmt+closing+credit);
  let bal=loan, prin=0; for(let i=0;i<12;i++){ const int=bal*r, p=pi-int; prin+=p; bal-=p; }
  const ss = (!fha||d.units<3) ? 'N/A (1–2 units)' : ((d.rentOther+d.rentYours)*.75>=piti?'PASS':'FAIL');
  return {downAmt,loan,pi,tax,ins,mi,piti,net,allIn,pctTake:allIn/M.monthlyNet,grossMo,lenderRent,dti,verdict,closing,credit,reserves,cash,gap,months,rent,opex,cf,coc,prin,ss};
}

  const out=(label,f,cls)=>`<tr class="${cls||''}"><td>${label}</td>${C.map((c,i)=>`<td class="r num">${f(c,i)}</td>`).join('')}</tr>`;
  const sec=t=>`<tr class="sec"><td colspan="4">${t}</td></tr>`;
  return `<div class="head"><div><h2>House hack deal calculator</h2><div class="sub">Type into any field — results update instantly. Changes stay on this device only.</div></div>
    <button class="btn" id="resetDeals">Reset to tracker values</button></div>
  <div class="card scroll dl"><table style="min-width:640px"><tr><th style="width:34%"></th>${deals.map((d,i)=>`<th><input data-i="${i}" data-k="name" value="${esc(d.name)}" style="text-align:left;font-weight:600"></th>`).join('')}</tr>
    ${sec('The property')}${inp('price',1000)}${inp('units',1)}${inp('rentOther',10)}${inp('rentYours',10)}${inp('hoa',10)}
    ${sec('The loan')}<tr><td>Loan type</td>${deals.map((d,i)=>`<td><select data-i="${i}" data-k="loan"><option${d.loan==='FHA'?' selected':''}>FHA</option><option${d.loan!=='FHA'?' selected':''}>Conventional</option></select></td>`).join('')}</tr>
    ${inp('rate',.01)}${inp('term',1)}${inp('tax',.01)}${inp('ins',50)}
    ${sec('Monthly payment')}
    ${out('Down payment',c=>money(c.downAmt))}${out('Loan (incl. FHA upfront MIP)',c=>money(c.loan))}${out('Principal + interest',c=>money(c.pi))}
    ${out('Property tax',c=>money(c.tax))}${out('Insurance',c=>money(c.ins))}${out('Mortgage insurance',c=>money(c.mi))}${out('<b>Total payment (PITI)</b>',c=>'<b>'+money(c.piti)+'</b>','tot')}
    ${sec('Year 1 — you live there')}${inp('util',10)}
    ${out('Your net housing cost',c=>money(c.net))}${out('All-in cost to live there',c=>'<b>'+money(c.allIn)+'</b>')}${out('As % of take-home',c=>`<span class="${c.pctTake>.4?'bad':c.pctTake>.3?'warn':'good'}">${pct(c.pctTake)}</span>`)}
    ${sec('Do you qualify?')}
    ${out('Gross monthly income',c=>money(c.grossMo))}${out('+ 75% of other units’ rent',c=>money(c.lenderRent))}${out('Debt-to-income',c=>pct(c.dti))}
    ${out('Verdict',c=>`<span class="pill ${c.verdict[1]}">${c.verdict[0]}</span>`)}${out('FHA 3–4 unit self-sufficiency',c=>c.ss)}
    ${sec('Cash needed')}${inp('closing',.1)}${inp('seller',.1)}${inp('reserves',1)}
    ${out('Closing costs',c=>money(c.closing))}${out('Seller credit',c=>money(c.credit))}${out('Reserves',c=>money(c.reserves))}
    ${out('<b>Total cash needed</b>',c=>'<b>'+money(c.cash)+'</b>','tot')}${out('Your property fund today',()=>money(D.prop.balance))}
    ${out('Gap',c=>`<span class="${c.gap<0?'bad':'good'}">${money(c.gap)}</span>`)}${out('Months to close the gap',c=>c.months)}
    ${sec('After you move out — full rental')}${inp('vac',1)}${inp('rep',1)}${inp('capex',1)}${inp('pm',1)}
    ${out('Total rent',c=>money(c.rent))}${out('Operating costs',c=>money(c.opex))}
    ${out('<b>Monthly cash flow</b>',c=>`<b class="${c.cf<0?'bad':'good'}">${money(c.cf)}</b>`,'tot')}${out('Annual cash flow',c=>money(c.cf*12))}
    ${out('Cash-on-cash return',c=>pct(c.coc))}${out('Principal paid down, year 1',c=>money(c.prin))}
  </table><div class="hint" style="margin-top:10px">${esc(D.dealNote)}</div></div>`;
};

function render(){
  document.querySelectorAll('#nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('view').innerHTML = V[view]();
  if(view==='paychecks') $('togAll').onclick=()=>{ showAll=!showAll; render(); };
  if(view==='deals'){
    $('resetDeals').onclick=()=>{ try{localStorage.removeItem(DKEY);}catch(_){} deals=null; render(); };
    $('view').querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{
      const d=deals[+el.dataset.i], k=el.dataset.k; d[k]= (k==='name'||k==='loan') ? el.value : (parseFloat(el.value)||0);
      try{localStorage.setItem(DKEY,JSON.stringify(deals));}catch(_){}
      const y=scrollY; render(); scrollTo(0,y);
    });
  }
  if(view==='areas'){
    $('resetW').onclick=()=>{ weights=null; try{localStorage.removeItem(WKEY);}catch(_){} render(); };
    $('view').querySelectorAll('[data-w]').forEach(el=>el.onchange=()=>{ weights[+el.dataset.w]=Math.max(0,parseFloat(el.value)||0); try{localStorage.setItem(WKEY,JSON.stringify(weights));}catch(_){} const y=scrollY; render(); scrollTo(0,y); });
  }
}
function route(){ const h=location.hash.slice(1); if(V[h]) view=h; render(); }
function start(data){
  D=data; $('lock').style.display='none'; $('app').style.display='block';
  $('upd').textContent='Updated '+D.updated;
  document.querySelectorAll('#nav a[data-v]').forEach(a=>a.onclick=()=>{ location.hash=a.dataset.v; });
  addEventListener('hashchange',route); route();
}
</script>
